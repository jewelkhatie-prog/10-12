
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Birthday Surprise ♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="curtains" id="curtains">
    <h1>A little surprise for you ♡</h1>
    <button id="openButton">Open Your Surprise ♡</button>
  </div>

  <main id="invitation">
    <h1>Happy Birthday!</h1>
    <p class="subtitle">I made a little something just for you.</p>
    <div class="cake">🎂</div>

    <p class="message">
      Today is all about you.<br><br>
      May your days be filled with little joys,
      beautiful memories, and endless reasons
      to smile. You deserve so much happiness.
    </p>

    <p class="signoff">Happy Birthday! 🎂</p>
    <div id="confetti"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
